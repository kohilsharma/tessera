<!doctype html>
<html lang="en" data-theme="newsroom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Newsroom's light ground, and only for the frames before main.tsx runs:
         applyTheme() rewrites this from whatever --paper resolved to, because a
         per-account override cannot be expressed as media-scoped metas (#75). The
         authored value is the signed-out theme's, which is also the theme every
         reader whose token has not been read yet is already painting. -->
    <meta name="theme-color" content="#faf8f4" />
    <title>Tessera | Story analysis</title>
    <!-- The three faces per theme DESIGN.md §4 assigns — eight families, not
         nine: Terminal spends one on both display and UI, separated by weight.
         One request: the browser fetches only the woff2 of a family it actually
         renders, so a reader in one theme does not pay for the other two. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&family=Spline+Sans+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
